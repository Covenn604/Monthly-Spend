services:
  monthly-spend:
    image: ${APP_IMAGE:-ghcr.io/covenn604/monthly-spend:latest}
    container_name: monthly-spend
    user: "${PUID:-10001}:${PGID:-10001}"
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8085}:8080"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env to at least 12 characters}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      CURRENCY: ${CURRENCY:-CAD}
      TZ: ${TZ:-America/Vancouver}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - monthly-spend-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  monthly-spend-data:
